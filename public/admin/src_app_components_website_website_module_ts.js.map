<!-- Page Header -->
<div class="page-header">
    <div>
        <h2 class="main-content-title tx-24 mg-b-5">Blogs</h2>
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="javascript:;">Home</a></li>
            <li class="breadcrumb-item active" aria-current="page">Blogs</li>
        </ol>
    </div>
    <div class="d-flex">
        <div class="justify-content-center">
            <button type="button" class="btn btn-white btn-icon-text my-2 mr-2">
              <i class="fe fe-filter mr-2"></i> Search
            </button>
        </div>
    </div>
</div>
<!-- End Page Header -->

<div class="row row-sm">
    <div class="col-md-12 col-lg-12">

        <div class="modal-body">

            <div class="form-group row">
        
                <div class="col-lg-12 mt-4">
                    
                    <app-input 
                        (onDataModelChange)="onSave($event)"
                        [type]="'text'" 
                        [class]="'form-control'" 
                        [id]="'title'"
                        [value]="blog.title"
                        [placeholder]="'Enter Blog Title'"
                        [(inputModel)]="blog.title">
                    </app-input>
        
                </div>
        
                <div class="col-lg-12 mt-4">
                    
                    <app-input 
                        (onDataModelChange)="onSave($event)"
                        [type]="'text'" 
                        [class]="'form-control'" 
                        [id]="'caption'"
                        [value]="blog.caption"
                        [placeholder]="'Enter Blog Caption'"
                        [(inputModel)]="blog.caption">
                    </app-input>
        
                </div>
        
                <div class="col-lg-12 mt-4">
                    
                    <app-input 
                        (onDataModelChange)="onSave($event)"
                        [type]="'text'" 
                        [class]="'form-control'" 
                        [id]="'meta_title'"
                        [value]="blog.meta_title"
                        [placeholder]="'Enter Blog Meta Title'"
                        [(inputModel)]="blog.meta_title">
                    </app-input>
        
                </div>
        
                <div class="col-lg-12 mt-4">
                    
                    <app-input 
                        (onDataModelChange)="onSave($event)"
                        [type]="'text'" 
                        [class]="'form-control'" 
                        [id]="'meta_description'"
                        [value]="blog.meta_description"
                        [placeholder]="'Enter Blog Meta Description'"
                        [(inputModel)]="blog.meta_description">
                    </app-input>
        
                </div>
        
                <div class="col-lg-12 mt-4">
                    
                    <app-input 
                        (onDataModelChange)="onSave($event)"
                        [type]="'text'" 
                        [class]="'form-control'" 
                        [id]="'meta_keywords'"
                        [value]="blog.meta_keywords"
                        [placeholder]="'Enter Blog Meta Keywords'"
                        [(inputModel)]="blog.meta_keywords">
                    </app-input>
        
                </div>
        
                <div class="col-lg-12 mt-4">
                    
                    <image-select
                        [label]="'Blog Cover'"
                        [id]="blog.id"
                        [uuid]="blog.uuid"
                        [value]="blog.cover"
                        (onModelChange)="onReceivedUpdate($event)"
                        [(inputModel)]="blog.cover">
                    </image-select>
        
                </div>
        
                <div class="col-lg-12 mt-4">
        
                    <div class="" style="background:white;padding: 30px">

                        <quill-editor [(ngModel)]="blog.content" (onContentChanged)="logChange($event, 'content')">
                            <div quill-editor-toolbar>
                                <span class="ql-formats">
                                    <select class="ql-font">
                                        <option selected></option>
                                        <option value="serif"></option>
                                        <option value="monospace"></option>
                                    </select>
                                    <select class="ql-size">
                                        <option value="small"></option>
                                        <option selected></option>
                                        <option value="large"></option>
                                        <option value="huge"></option>
                                    </select>
                                </span>
                                <span class="ql-formats">
                                    <button class="ql-bold"></button>
                                    <button class="ql-italic"></button>
                                    <button class="ql-underline"></button>
                                    <button class="ql-strike"></button>
                                </span>
                                <span class="ql-formats">
                                    <select class="ql-color"></select>
                                    <select class="ql-background"></select>
                                </span>
                                <span class="ql-formats">
                                    <button class="ql-list" value="ordered"></button>
                                    <button class="ql-list" value="bullet"></button>
                                    <select class="ql-align">
                                        <option selected></option>
                                        <option value="center"></option>
                                        <option value="right"></option>
                                        <option value="justify"></option>
                                    </select>
                                </span>
                                <span class="ql-formats">
                                    <button class="ql-link"></button>
                                    <button class="ql-image"></button>
                                </span>
                            </div>
                        </quill-editor>
                    
                    </div>
            
                </div>
        
        
              </div>
        
        </div>

    </div>
</div>
